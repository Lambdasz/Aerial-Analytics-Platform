name: Install Tauri Linux system dependencies
description: Installs the apt packages required to build/lint Tauri apps on Linux (see https://v2.tauri.app/start/prerequisites/)

runs:
  using: composite
  steps:
    - name: Install Tauri system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev
