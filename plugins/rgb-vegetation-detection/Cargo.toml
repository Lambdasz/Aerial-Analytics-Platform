[package]
name = "rgb-vegetation-detection"
version = "1.0.0"
edition = "2021"
description = "Module 4 - RGB Vegetation Detection Plugin"

[lib]
name = "rgb_vegetation"
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "experiment"
path = "src/bin/experiment.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
serde_json = { version = "1", features = ["preserve_order"] }
